<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چت | Wahed Sarwary</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae2;--bar:#0f6b5c;--bar-ink:#fff;--mine:#d9fdd3;--theirs:#fff;--ink:#1d2b27;--muted:#667781;--send:#0f6b5c;--field:#fff;--panel:#f0f2f5;--line:#dfe3e6;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a17;--bar:#173d36;--mine:#0c5a4b;--theirs:#1f2f2b;--ink:#e8f2ef;--muted:#93a8a2;--send:#1fa68f;--field:#22332f;--panel:#16231f;--line:#2a3b37;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--send);outline-offset:1px}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover}
#auth{height:100%;display:grid;place-items:center;padding:20px}
.box{width:min(360px,100%);background:var(--field);border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 2px 14px #0002}
.box h1{margin:12px 0 2px;font-size:1.3rem}
.box p{margin:0 0 18px;color:var(--muted);font-size:.85rem}
.box input{width:100%;margin-bottom:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--send);background:var(--send);color:#fff;cursor:pointer}
.btns button.alt{background:none;color:var(--send)}
#err{color:var(--err);min-height:1.6em;font-size:.85rem;margin:0 0 8px}
#app{height:100%;display:grid;grid-template-columns:340px 1fr}
#side{background:var(--field);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .logo{width:44px;height:44px}
.top small{display:block;opacity:.85;font-size:.75rem}
#list{overflow-y:auto;flex:1}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:right;cursor:pointer}
.row.on{background:var(--panel)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;position:relative}
.dot{position:absolute;bottom:0;inset-inline-end:0;width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid var(--field)}
.rt{flex:1;min-width:0}
.rt b{display:block}
.rt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--send);color:#fff;border-radius:12px;min-width:24px;padding:0 7px;text-align:center;font-size:.8rem}
#chat{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#chat header{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:10px 16px}
#chat header small{display:block;opacity:.85;font-size:.75rem}
#back{display:none;background:none;border:0;color:#fff;font-size:1.8rem;line-height:1;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,420px);padding:6px 10px 4px;border-radius:12px;background:var(--theirs);align-self:flex-end;word-wrap:break-word;box-shadow:0 1px 1px #0002}
.m.me{background:var(--mine);align-self:flex-start}
.m .n{font-size:.78rem;font-weight:600;display:block;color:var(--send)}
.m .t{white-space:pre-wrap}
.m time{display:block;font-size:.7rem;color:var(--muted);text-align:left}
.hint{margin:auto;color:var(--muted);text-align:center;padding:24px}
form{display:flex;gap:8px;padding:8px 10px;background:var(--panel)}
form input{flex:1;border:0;border-radius:22px;padding:10px 16px;background:var(--field);color:var(--ink)}
form button{border:0;border-radius:50%;width:44px;height:44px;background:var(--send);color:#fff;font-size:1.2rem;cursor:pointer}
form :disabled{opacity:.5;cursor:not-allowed}
@media (max-width:700px){
#app{grid-template-columns:1fr}
#chat{display:none}
#app.chat #chat{display:flex}
#app.chat #side{display:none}
#back{display:block}
}
</style>
</head>
<body>
<div id="auth" hidden>
  <div class="box">
    <img class="logo" alt="Wahed Sarwary">
    <h1>چت دوستان</h1>
    <p>تهیه‌کننده: <bdi>Wahed Sarwary</bdi></p>
    <input id="name" placeholder="نام کاربری" autocomplete="username" maxlength="20">
    <input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password" maxlength="100">
    <div id="err" role="alert"></div>
    <div class="btns"><button id="login">ورود</button><button id="signup" class="alt">ساخت حساب</button></div>
  </div>
</div>
<div id="app" hidden>
  <aside id="side">
    <div class="top"><img class="logo" alt="Wahed Sarwary"><div><b id="who"></b><small>تهیه‌کننده: <bdi>Wahed Sarwary</bdi></small></div></div>
    <div id="list"></div>
  </aside>
  <section id="chat">
    <header><button id="back" aria-label="بازگشت">›</button><div id="hav"></div><div><b id="ht"></b><small id="hs"></small></div></header>
    <div id="msgs"></div>
    <form id="f" autocomplete="off"><input id="in" placeholder="پیام بنویسید" maxlength="1000" aria-label="متن پیام"><button id="go" aria-label="ارسال">➤</button></form>
  </section>
</div>

const $=id=>document.getElementById(id);
let ws,me,users=[],msgs=[],cur='*',unread={},retry=0;
document.querySelectorAll('.logo').forEach(i=>i.src=PHOTO);
const K=m=>m.to==='*'?'*':(m.from===me?m.to:m.from);
const fmt=ts=>new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
function av(name,group){
  const d=document.createElement('div');d.className='av';
  if(group){d.textContent='گ';d.style.background='#0f6b5c'}
  else{d.textContent=[...name][0].toUpperCase();d.style.background='hsl('+([...name].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360)+' 45% 38%)'}
  return d;
}
function showAuth(){$('app').hidden=true;$('auth').hidden=false}
async function doAuth(kind){
  $('err').textContent='';
  try{
    const r=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,password:$('pw').value})});
    const d=await r.json();
    if(d.error){$('err').textContent=d.error;return}
    localStorage.setItem('tk',d.token);$('pw').value='';connect();
  }catch(e){$('err').textContent='اتصال به سرور برقرار نشد'}
}
$('login').onclick=()=>doAuth('login');
$('signup').onclick=()=>doAuth('signup');
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth('login')});

function connect(){
  const tk=localStorage.getItem('tk');
  if(!tk){showAuth();return}
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?token='+encodeURIComponent(tk));
  ws.onopen=()=>{retry=0;$('go').disabled=$('in').disabled=false};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='init'){me=d.me;users=d.users;msgs=d.msgs;$('who').textContent=me;$('auth').hidden=true;$('app').hidden=false;renderList();renderChat()}
    else if(d.type==='users'){users=d.users;renderList();renderHead()}
    else if(d.type==='msg'){
      msgs.push(d.msg);const k=K(d.msg);
      if(d.msg.from!==me&&(k!==cur||document.hidden||$('app').className.indexOf('chat')<0&&innerWidth<=700))unread[k]=(unread[k]||0)+1;
      renderList();if(k===cur)renderChat();
    }
  };
  ws.onclose=e=>{
    $('go').disabled=$('in').disabled=true;
    if(e.code===4401){localStorage.removeItem('tk');showAuth();return}
    setTimeout(connect,Math.min(1000*2**retry++,15000));
  };
}
function renderList(){
  const list=$('list');list.textContent='';
  const others=users.filter(u=>u.name!==me).map(u=>({k:u.name,t:u.name,on:u.online}));
  const last=k=>{for(let i=msgs.length-1;i>=0;i--)if(K(msgs[i])===k)return msgs[i]};
  others.sort((a,b)=>((last(b.k)||{ts:0}).ts)-((last(a.k)||{ts:0}).ts));
  [{k:'*',t:'گروه عمومی',g:true}].concat(others).forEach(c=>{
    const b=document.createElement('button');b.className='row'+(c.k===cur?' on':'');
    const a=av(c.t,c.g);if(c.on){const d=document.createElement('i');d.className='dot';a.append(d)}
    const rt=document.createElement('div');rt.className='rt';
    const t=document.createElement('b');t.textContent=c.t;
    const s=document.createElement('small');const l=last(c.k);
    s.textContent=l?((l.from===me?'شما: ':(c.g?l.from+': ':''))+l.text):(c.g?'همه‌ی اعضا اینجا هستند':'هنوز پیامی نیست');
    rt.append(t,s);b.append(a,rt);
    if(unread[c.k]){const u=document.createElement('span');u.className='badge';u.textContent=unread[c.k].toLocaleString('fa-IR');b.append(u)}
    b.onclick=()=>{cur=c.k;unread[c.k]=0;$('app').classList.add('chat');renderList();renderChat();$('in').focus()};
    list.append(b);
  });
}
function renderHead(){
  const g=cur==='*';
  $('hav').textContent='';$('hav').append(av(g?'گروه':cur,g));
  $('ht').textContent=g?'گروه عمومی':cur;
  const u=users.find(x=>x.name===cur);
  $('hs').textContent=g?users.filter(x=>x.online).length.toLocaleString('fa-IR')+' نفر آنلاین':(u&&u.online?'آنلاین':'آفلاین');
}
function renderChat(){
  renderHead();
  const box=$('msgs');box.textContent='';
  const rows=msgs.filter(m=>K(m)===cur);
  if(!rows.length){const p=document.createElement('p');p.className='hint';p.textContent='هنوز پیامی نیست. اولین پیام را بفرستید.';box.append(p)}
  rows.forEach(r=>{
    const d=document.createElement('div');d.className='m'+(r.from===me?' me':'');
    if(cur==='*'&&r.from!==me){const n=document.createElement('span');n.className='n';n.textContent=r.from;d.append(n)}
    const t=document.createElement('span');t.className='t';t.textContent=r.text;
    const tm=document.createElement('time');tm.textContent=fmt(r.ts);
    d.append(t,tm);box.append(d);
  });
  box.scrollTop=box.scrollHeight;
}
$('back').onclick=()=>{$('app').classList.remove('chat');renderList()};
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const text=$('in').value.trim();
  if(!text||!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify({type:'msg',to:cur,text}));
  $('in').value='';
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unread[cur]){unread[cur]=0;renderList()}});
connect();
</script>
</body>
</html>
